# Edge Nginx inside the Docker Compose network.
# Resolves `api` via Docker DNS so `docker compose up --scale api=N` load-balances.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # SPA under /devnet/
  location /devnet/ {
    try_files $uri $uri/ /devnet/index.html;
  }

  location = /devnet {
    return 301 /devnet/;
  }

  # API proxy — variable upstream forces runtime DNS resolution
  location /devnet/api/ {
    set $api_upstream http://api:4000;
    rewrite ^/devnet/api/(.*)$ /api/$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
  }

  location = /devnet/api {
    return 301 /devnet/api/;
  }

  location /healthz {
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}

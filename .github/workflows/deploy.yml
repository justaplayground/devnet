name: 🚀 Deploy Docker Compose | Dellbuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ORIGIN_SERVER_NAME: "launch.giangnt.dev"
  PROJECT_NAME: "devnet"
  DEPLOY_DIR: "/var/www/devnet"
  EDGE_PORT: "8088"

jobs:
  deploy:
    runs-on: [self-hosted, home, dellbuntu]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure deploy directory
        run: |
          sudo mkdir -p ${{ env.DEPLOY_DIR }}
          sudo chown -R gh-runner:gh-runner ${{ env.DEPLOY_DIR }}

      - name: Sync source into deploy directory
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'server/node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            ./ ${{ env.DEPLOY_DIR }}/src/

      - name: Require server .env
        run: |
          if [ ! -f ${{ env.DEPLOY_DIR }}/.env ]; then
            echo "Missing ${{ env.DEPLOY_DIR }}/.env — copy .env.example and set secrets before deploying."
            exit 1
          fi
          # Compose reads .env from the project directory
          cp ${{ env.DEPLOY_DIR }}/.env ${{ env.DEPLOY_DIR }}/src/.env

      - name: Build and start Compose stack
        working-directory: ${{ env.DEPLOY_DIR }}/src
        run: |
          docker compose pull || true
          docker compose up -d --build --remove-orphans

      - name: Install host Nginx include
        run: |
          EDGE_PORT=$(grep -E '^EDGE_PORT=' ${{ env.DEPLOY_DIR }}/.env | cut -d= -f2- || echo "${{ env.EDGE_PORT }}")
          EDGE_PORT=${EDGE_PORT:-${{ env.EDGE_PORT }}}
          sed -e "s/\${PROJECT_NAME}/${{ env.PROJECT_NAME }}/g" \
              -e "s/\${EDGE_PORT}/${EDGE_PORT}/g" \
              ${{ env.DEPLOY_DIR }}/src/infra/nginx/modular.conf \
            | sudo tee /etc/nginx/includes/projects/${{ env.PROJECT_NAME }}.conf > /dev/null
          sudo nginx -t
          sudo nginx -s reload

      - name: Health check
        run: |
          sleep 3
          curl -fsS "http://127.0.0.1:${{ env.EDGE_PORT }}/healthz"
          curl -fsS "http://127.0.0.1:${{ env.EDGE_PORT }}/devnet/api/health"

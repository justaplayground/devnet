name: 🚀 Deploy to Nginx | Dellbuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_npm_install:
        description: "Bypass npm cache and run a cold install"
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

env:
  ORIGIN_SERVER_NAME: "launch.giangnt.dev"
  PROJECT_NAME: "devnet"
  # BASE_API_URL: "/api"

jobs:
  # Build on Github Ubuntu to save the resource
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cached install (default). Skip this step when forcing a cold install.
      - uses: actions/setup-node@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_npm_install) }}
        with:
          node-version: "20"
          cache: npm

      # Cold install path — no npm cache restore
      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_npm_install }}
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.force_npm_install }}" = "true" ]; then
            npm cache clean --force
            rm -rf node_modules
          fi
          npm ci --legacy-peer-deps

      - name: Build frontend
        run: |
          npm run build
          # Patch modular Nginx snippet into dist (active deploy path)
          cp infra/nginx/modular.conf dist/nginx.modular.conf
          sed -i "s/\${PROJECT_NAME}/${{ env.PROJECT_NAME }}/g" dist/nginx.modular.conf

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-dist
          path: dist

  # Deploy to Dellbuntu | My Home Server
  # NOTE: This requires passwordless sudo for gh-runner user
  # Run on server: sudo visudo and add: gh-runner ALL=(ALL) NOPASSWD: ALL
  deploy-frontend:
    runs-on: [self-hosted, home, dellbuntu]
    needs: build-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-dist
          path: dist

      - name: Prepare nginx deploy path
        run: |
          sudo mkdir -p /var/www/${{ env.PROJECT_NAME }}
          sudo chown -R gh-runner:gh-runner /var/www/${{ env.PROJECT_NAME }}

      - name: Deploy frontend to nginx folder
        run: |
          WWW="/var/www/${{ env.PROJECT_NAME }}"
          # Stage new build, then swap (avoids serving a half-copied tree)
          rm -rf "$WWW/dist.next"
          cp -r dist "$WWW/dist.next"
          sudo cp "$WWW/dist.next/nginx.modular.conf" /etc/nginx/includes/projects/${{ env.PROJECT_NAME }}.conf
          sudo nginx -t
          if [ -d "$WWW/dist" ]; then
            mv "$WWW/dist" "$WWW/dist.prev"
          fi
          mv "$WWW/dist.next" "$WWW/dist"
          sudo nginx -s reload
          rm -rf "$WWW/dist.prev"

      - name: Cleanup downloaded artifacts
        if: success()
        run: |
          rm -rf dist
          rm -rf /tmp/${{ env.PROJECT_NAME }}-* || true


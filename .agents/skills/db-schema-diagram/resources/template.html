<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[PROJECT NAME] - Database Schema</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'JetBrains Mono',monospace;background:#020617;color:#fff;padding:2rem}
.container{max-width:1600px;margin:auto}
.header-row{display:flex;align-items:center;gap:1rem;margin-bottom:.4rem}
.pulse-dot{width:12px;height:12px;border-radius:50%;background:#22d3ee;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.subtitle{margin-left:1.7rem;color:#94a3b8;font-size:.85rem}
.diagram{margin-top:1.5rem;background:#0f172acc;border:1px solid #1e293b;border-radius:16px;padding:24px;overflow:auto}
svg{width:100%;min-width:1400px}
.toolbar{margin-left:auto;display:flex;align-items:center;gap:.5rem}
.toolbar-actions{display:none;gap:.5rem}
.toolbar.expanded .toolbar-actions{display:flex}
button{font:inherit;background:#1e293bcc;color:#94a3b8;border:1px solid #334155;padding:.4rem .7rem;border-radius:6px;cursor:pointer}
.toolbar-toggle{background:none;border:none;font-size:20px}
.footer{text-align:center;color:#475569;margin-top:1rem;font-size:.75rem}
@media print{.toolbar{display:none!important}}
</style>
</head>
<body>
<div class="container" id="report-container">
<div class="header-row">
<div class="pulse-dot"></div>
<h1>[PROJECT NAME] - Database Schema</h1>
<div class="toolbar">
<div class="toolbar-actions">
<button onclick="copyAsImage(this)">📋 Copy</button>
<button onclick="downloadPNG(this)">🖼️ PNG</button>
<button onclick="downloadPDF(this)">📄 PDF</button>
</div>
<button class="toolbar-toggle" onclick="this.parentElement.classList.toggle('expanded')">⋯</button>
</div>
</div>
<div class="subtitle">Replace sample tables with your schema.</div>

<div class="diagram">
<svg viewBox="0 0 1600 900">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M40 0L0 0 0 40" fill="none" stroke="#1e293b" stroke-width=".5"/>
</pattern>

<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0,10 3.5,0 7" fill="context-stroke"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="url(#grid)"/>

<!-- ===== TABLE TEMPLATE ===== -->

<g id="users" transform="translate(60,80)">
<rect width="280" height="240" rx="8" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/>
<rect width="280" height="36" rx="8" fill="rgba(8,51,68,.45)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="18" y="23" fill="white" font-size="13" font-weight="700">users</text>

<text x="14" y="60" fill="#22d3ee" font-size="11">🔑 id</text><text x="180" y="60" fill="#94a3b8" font-size="11">uuid</text>
<line x1="10" x2="270" y1="70" y2="70" stroke="#1e293b"/>
<text x="14" y="92" fill="white" font-size="11">email</text><text x="180" y="92" fill="#94a3b8" font-size="11">varchar</text>
<line x1="10" x2="270" y1="102" y2="102" stroke="#1e293b"/>
<text x="14" y="124" fill="white" font-size="11">name</text><text x="180" y="124" fill="#94a3b8" font-size="11">varchar</text>
<line x1="10" x2="270" y1="134" y2="134" stroke="#1e293b"/>
<text x="14" y="156" fill="white" font-size="11">created_at</text><text x="180" y="156" fill="#94a3b8" font-size="11">timestamp</text>
</g>

<g id="posts" transform="translate(520,80)">
<rect width="300" height="280" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
<rect width="300" height="36" rx="8" fill="rgba(6,78,59,.45)" stroke="#34d399" stroke-width="1.5"/>
<text x="18" y="23" fill="white" font-size="13" font-weight="700">posts</text>

<text x="14" y="60" fill="#34d399" font-size="11">🔑 id</text><text x="200" y="60" fill="#94a3b8" font-size="11">uuid</text>
<line x1="10" x2="290" y1="70" y2="70" stroke="#1e293b"/>
<text x="14" y="92" fill="#fbbf24" font-size="11">🔗 user_id</text><text x="200" y="92" fill="#94a3b8" font-size="11">uuid</text>
<line x1="10" x2="290" y1="102" y2="102" stroke="#1e293b"/>
<text x="14" y="124" fill="white" font-size="11">title</text><text x="200" y="124" fill="#94a3b8" font-size="11">varchar</text>
<line x1="10" x2="290" y1="134" y2="134" stroke="#1e293b"/>
<text x="14" y="156" fill="white" font-size="11">content</text><text x="200" y="156" fill="#94a3b8" font-size="11">text</text>
</g>

<line x1="340" y1="170" x2="520" y2="170"
stroke="#fbbf24" stroke-width="2"
marker-end="url(#arrowhead)"/>
<text x="430" y="160" fill="#fbbf24" font-size="10" text-anchor="middle">1 → N</text>

<!-- Legend -->
<g transform="translate(1180,70)">
<text fill="white" font-size="12" font-weight="700">Legend</text>
<text y="30" fill="#22d3ee" font-size="11">🔑 Primary Key</text>
<text y="52" fill="#fbbf24" font-size="11">🔗 Foreign Key</text>
<text y="74" fill="#94a3b8" font-size="11">Datatype</text>
</g>

</svg>
</div>

<p class="footer">Duplicate table groups and relationship lines as needed.</p>
</div>

<script>
async function capture(){
const el=document.getElementById('report-container');
const r=el.getBoundingClientRect(),pad=32;
return html2canvas(document.body,{backgroundColor:'#020617',scale:2,useCORS:true,
ignoreElements:e=>e.classList&&e.classList.contains('toolbar'),
x:r.left+scrollX-pad,y:r.top+scrollY-pad,width:r.width+pad*2,height:r.height+pad*2});
}
async function copyAsImage(b){const c=await capture();const blob=await new Promise(r=>c.toBlob(r));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);}
async function downloadPNG(){const c=await capture();const a=document.createElement('a');a.download='db-schema.png';a.href=c.toDataURL();a.click();}
async function downloadPDF(){const c=await capture();const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:c.width>c.height?'landscape':'portrait',unit:'px',format:[c.width,c.height],hotfixes:['px_scaling']});pdf.addImage(c.toDataURL(),'PNG',0,0,c.width,c.height);pdf.save('db-schema.pdf');}
</script>
</body>
</html>
